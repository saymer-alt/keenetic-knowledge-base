name: Knowledge Base site (MkDocs)

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'tools/prepare_site_docs.py'
      - 'tests/test_site_sources.py'
      - '.github/workflows/docs-site.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'tools/prepare_site_docs.py'
      - 'tests/test_site_sources.py'
      - '.github/workflows/docs-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knowledge-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build curated documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install pinned documentation tooling
        run: python -m pip install -r requirements-docs.txt
      - name: Test curation and link safety
        run: python -m unittest discover -s tests -p 'test_site_sources.py' -v
      - name: Prepare curated sources
        run: python tools/prepare_site_docs.py
      - name: Build site (fail on warnings)
        run: python -m mkdocs build --strict
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site-build

  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
