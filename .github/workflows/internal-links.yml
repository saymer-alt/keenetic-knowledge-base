name: Internal links

# Local Markdown links are checked for every Markdown file in the repository,
# including root-level files and nested folders. The old check lived in
# docs-site.yml, which only ran for a subset of paths.
on:
  pull_request:
    paths:
      - '*.md'
      - '**/*.md'
      - 'tests/test_internal_links.py'
      - '.github/workflows/internal-links.yml'
  push:
    branches: [main]
    paths:
      - '*.md'
      - '**/*.md'
      - 'tests/test_internal_links.py'
      - '.github/workflows/internal-links.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: internal-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Check local Markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parser self-test
        run: python tests/test_internal_links.py --self-test
      - name: Check links across the repository
        run: python tests/test_internal_links.py
